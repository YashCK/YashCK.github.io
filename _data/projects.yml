cyclotron-gpu-performance-model:
  name: Cyclotron (GPU Performance Model)
  excerpt: "Cyclotron is a Rust-based functional simulator for the Radiance GPU architecture at UC Berkeley. This project extends it with a timing layer to be a cycle-accurate performance model. We wrap around the existing core simulator using chained, parametrized timing queues to model shared resources like global and shared memory. This allows us to capture realistic latency, bandwidth, and backpressure without changing the underlying functional execution."
  stack: [Rust, C++, RISC-V]
  category: Research

artifact-rejection-neural-signals:
  name: Artifact Rejection for Neural Signals
  excerpt: "The overarching goal of this project is to aid in creating a closed-loop neuromodulation system that epidurally stimulates the brain. By delivering specific electric fields through electrodes, we can observe changes in cognitive or behavioral functions. By analyzing these changes and identifying which forms of stimulation are effective we may able to improve therapeutic outcomes. However when stimulation is applied, significant artifacts occur which prevent us from being able to create such a system currently. This research aims to investigate the removal of these artifacts from recorded signals along with any other noise contaminating the data."
  stack: [Python]
  category: Research

